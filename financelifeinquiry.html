'환율':'두 나라 화폐를 교환하는 비율입니다. 원/달러 환율이 오르면 같은 달러의 원화 환산액이 커집니다.',

};
function conceptHTML(q){return `<details class="soft"><summary>개념 도움말 · 비교할 때 열어 보기</summary>${q.concept.split(' · ').map(c=>`<p style="margin:10px 0"><b>${E(c)}</b> — ${E(CONCEPTS[c]||'목표와 사용 시기에 맞춰 판단합니다.')}</p>`).join('')}</details>`;}
function tableHTML(q){return q.data?`<div class="table-wrap"><table><thead><tr>${q.data.head.map(x=>`<th>${E(x)}</th>`).join('')}</tr></thead><tbody>${q.data.rows.map(row=>`<tr>${row.map(x=>`<td>${E(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:'';}

function blank(){return {version:VERSION,team:'',members:'',name:'',job:'steady',family:'child',life:'home',priority:'balance',traits:[null,null,null,null],goals:AGES.map(()=>({id:'',type:'',text:''})),records:AGES.map(()=>({choices:[null,null],reasons:['',''],confirmed:false})),review:{verdict:'',evidence:'',revisions:AGES.map(()=>({enabled:false,choices:[null,null],reason:''})),reflection:'',principle:''},view:'profile',age:0};}
let state=blank();let persistOk=true;try{const embedded=JSON.parse(document.getElementById('embedded-data').textContent);const stored=JSON.parse(localStorage.getItem(KEY));if(validState(embedded))state=embedded;else if(validState(stored))state=stored;}catch(e){}
function validState(s){return !!s&&s.version===VERSION&&typeof s.team==='string'&&typeof s.name==='string'&&typeof s.members==='string'&&JOBS[s.job]&&FAMILIES[s.family]&&LIFE[s.life]&&PRIORITIES[s.priority]&&Array.isArray(s.traits)&&s.traits.length===4&&s.traits.every(x=>x===null||x===0||x===1)&&Array.isArray(s.goals)&&s.goals.length===6&&s.goals.every((g,i)=>g&&typeof g.text==='string'&&((g.id===''&&g.type===''&&g.text==='')||GOAL_CATALOG[i].some(x=>x.id===g.id&&x.type===g.type&&x.text===g.text)))&&Array.isArray(s.records)&&s.records.length===6&&s.records.every(r=>Array.isArray(r.choices)&&r.choices.length===2&&r.choices.every(x=>x===null||[0,1,2].includes(x))&&Array.isArray(r.reasons)&&r.reasons.length===2&&r.reasons.every(x=>typeof x==='string')&&typeof r.confirmed==='boolean')&&s.review&&['verdict','evidence','reflection','principle'].every(k=>typeof s.review[k]==='string')&&Array.isArray(s.review.revisions)&&s.review.revisions.length===6&&s.review.revisions.every(r=>typeof r.enabled==='boolean'&&typeof r.reason==='string'&&Array.isArray(r.choices)&&r.choices.length===2&&r.choices.every(x=>x===null||[0,1,2].includes(x)))&&['profile','journey','result','review','report'].includes(s.view)&&Number.isInteger(s.age)&&s.age>=0&&s.age<6;}
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const txt=s=>E(s||'미작성');
function notify(msg){const el=document.getElementById('toast');el.textContent=msg;el.style.display='block';clearTimeout(notify.timer);notify.timer=setTimeout(()=>el.style.display='none',3500)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));persistOk=true}catch(e){persistOk=false}document.getElementById('save-status').textContent=persistOk?'이 브라우저에 자동 저장됨 · 제출은 PDF 또는 작성 기록 파일로':'자동 저장 불가 · 작성 기록 저장 버튼으로 보관하세요';}
function profileReady(){return state.team.trim()&&state.name.trim()&&state.traits.every(x=>x!==null)&&state.goals.every((x,i)=>x.id&&GOAL_CATALOG[i].some(g=>g.id===x.id&&g.type===x.type&&g.text===x.text));}
function completed(){return state.records.every(r=>r.confirmed&&r.choices.every(x=>x!==null)&&r.reasons.every(x=>x.trim()));}
function reviewReady(){return state.review.verdict&&state.review.evidence.trim()&&state.review.reflection.trim()&&state.review.principle.trim()&&state.review.revisions.every(r=>!r.enabled||(r.reason.trim()&&r.choices.every(x=>x!==null)));}
function typeCode(){if(state.traits.some(x=>x===null))return '성향 설정 중';if(state.priority==='liquid')return '필요할 때 꺼내 쓰는 실속형';if(state.priority==='income')return '꾸준한 소득을 만드는 투자자형';if(state.priority==='ethical')return '사회적 가치도 살피는 투자자형';if(state.priority==='safety')return state.traits[0]===0?'안정을 지키는 투자자형':'기반을 지키며 성장하는 투자자형';if(state.priority==='growth')return state.traits[0]===1?'성장 기회를 찾는 투자자형':'신중하게 성장하는 투자자형';return '균형을 설계하는 투자자형';}
function typeNames(){return TRAITS.map((t,i)=>state.traits[i]===null?'미설정':t.names[state.traits[i]]).join(' · ');}
function typeDescription(){let p=PRIORITIES[state.priority];return `${p.desc} ${state.traits[0]===0?'큰 손실에는 신중한 편입니다.':'감당할 수 있는 변동 안에서는 장기 성장도 고려합니다.'} ${state.traits[1]===0?'현재 경험에도 자원을 남기고 싶어 합니다.':'미래 목표의 준비를 더 중요하게 생각합니다.'} ${state.traits[2]===0?'계획과 기록을 통해 관리합니다.':'상황이 달라지면 배분을 조정합니다.'} 성향과 실제 돈의 사용 시기가 다르면 전략도 조정할 수 있습니다.`;}
function defaultGoal(i){let ids=['independent','housing',state.family==='child'?'education':'career','retire','living','medical'];if(state.life==='experience')ids[0]='travel';if(state.priority==='growth')ids[0]='seed';const g=GOAL_CATALOG[i].find(x=>x.id===ids[i])||GOAL_CATALOG[i][0];return [g.type,g.text,g.id];}
function setExample(i){const g=defaultGoal(i);setGoal(i,g[2]);}
function setGoal(i,id){const g=GOAL_CATALOG[i].find(x=>x.id===id);if(state.goals[i].id!==id){state.goals[i]=g?{id:g.id,type:g.type,text:g.text}:{id:'',type:'',text:''};for(let z=i;z<6;z++)state.records[z].confirmed=false;state.review.revisions=AGES.map(()=>({enabled:false,choices:[null,null],reason:''}));}save();render();}
function invalidate(){state.records.forEach(r=>r.confirmed=false);state.review.revisions=AGES.map(()=>({enabled:false,choices:[null,null],reason:''}));}
function field(k,v){if(['job','family','life','priority'].includes(k)&&state[k]!==v)invalidate();state[k]=v;save();if(['job','family','life','priority'].includes(k))render();else updateProfileStatus();}
function goalField(i,k,v){state.goals[i][k]=v;state.records[i].confirmed=false;save();updateProfileStatus();}
function updateProfileStatus(){let el=document.getElementById('start-journey');if(el)el.disabled=!profileReady();}
function trait(i,v){if(state.traits[i]!==v){state.traits[i]=v;invalidate();}save();render();}
function goto(view){if(view!=='profile'&&!profileReady()){notify('모둠·인물 이름, 성향 4개, 생애주기별 목표를 먼저 설정하세요.');return}if(['result','review','report'].includes(view)&&!completed()){notify('여섯 생애주기의 선택과 이유를 모두 기록하고 확정하세요.');return}state.view=view;save();render();window.scrollTo(0,0);}
function ageGo(i){if(i>0&&!state.records[i-1].confirmed){notify('앞 시기의 선택과 이유를 먼저 확정하세요.');return}state.age=i;save();render();window.scrollTo(0,0);}
function choose(j,k){state.records[state.age].choices[j]=k;state.records[state.age].confirmed=false;save();render();}
function writeReason(j,v){state.records[state.age].reasons[j]=v;state.records[state.age].confirmed=false;save();updateNext();}
function updateNext(){let el=document.getElementById('confirm-stage');if(el){const r=state.records[state.age];el.disabled=!r.choices.every(x=>x!==null)||!r.reasons.every(x=>x.trim());}}
function confirmStage(){const r=state.records[state.age];if(r.choices.some(x=>x===null)||r.reasons.some(x=>!x.trim())){notify('두 선택과 이유를 모두 작성하세요.');return}if(r.confirmed){if(state.age<5)state.age++;else state.view='result';save();render();window.scrollTo(0,0);return;}if(state.records.slice(state.age+1).some(x=>x.reasons.some(v=>v.trim()))&&!confirm('이 시기의 변경을 확정하면 뒤 시기의 선택과 이유가 초기화됩니다. 계속할까요? 수정 전·후를 비교하려면 평가·수정 탭을 이용하세요.'))return;for(let j=state.age+1;j<6;j++){state.records[j].confirmed=false;state.records[j].choices=[null,null];state.records[j].reasons=['',''];}state.review.revisions=AGES.map(()=>({enabled:false,choices:[null,null],reason:''}));r.confirmed=true;if(state.age<5)state.age++;else state.view='result';save();render();window.scrollTo(0,0);}
function option(title,desc,effect,ratings,outcome){return {title,desc,effect,ratings,outcome};}

 const n=state.name||'이 인물',child=state.family==='child',g=goalSpec(i),job=JOB_META[state.job],priority=PRIORITIES[state.priority],fmt=x=>Number(x).toLocaleString('ko-KR');
 const last=carry.buffer>=55?'앞선 선택으로 갑작스러운 지출에 대응할 여유가 비교적 있습니다.':carry.buffer>=35?'기본 여유는 있지만 큰 지출에는 조정이 필요합니다.':'생활 대응 여유가 줄어 갑작스러운 지출에 더 주의해야 합니다.';
 const intro=`${n}은 ${AGES[i]}를 맞았습니다. ${i<4?job.desc:'일하는 시간을 줄이면서 은퇴 이후의 생활을 관리합니다.'} ${i?last:''} 투자에서는 ${priority.name}를 중요하게 생각합니다.`;
 let q=[];
 if(i===0){const need=Math.ceil(g.cost/g.months),available=80,newMonths=g.months+12,newNeed=Math.ceil(g.cost/newMonths);q=[task('원하는 삶을 숫자로 계획한다면?',`${n}의 목표는 ‘${g.title}’입니다. ${job.variable?'수입이 달라질 수 있어 적게 버는 달을 기준으로':'이번 상황의 월급에서 생활비를 뺀 뒤'} 매달 80만 원을 목표 자금·비상금·경험비에 배분할 수 있습니다. 이자는 제외하고 처음부터 돈을 모은다고 가정합니다. 목표를 그대로 유지할지, 기간을 바꿀지 정해 보세요.`, '합리적 선택 · 생애주기 · 예금·적금',[
 option('기간은 지키고 예산 조정',need>available?`추가로 필요한 월 ${need-available}만 원을 소비 조정·가능한 추가 소득으로 마련할 계획을 세운다.`:`월 ${need}만 원을 목표 적금에 넣고 남은 ${available-need}만 원은 비상금·경험비로 나눈다.`,[10,15,4,need>available?-4:7],[2,2,2,2],'목표 금액과 기간을 따져 실천할 수 있는 예산을 만들었습니다. 줄이는 소비나 추가 활동의 비용도 확인해야 합니다.'),

 option('이자가 높은 1년 정기예금에 전부 넣기','중도 해지하면 약정 이자가 줄어드는 조건인데도 1,000만 원 모두를 1년 예금에 넣고 다음 달 필요는 고려하지 않는다.',[-9,1,4,0],[1,0,0,1],'원금 손실 위험이 비교적 낮은 상품이어도 사용 시기와 해지 조건을 놓치면 목표에 맞지 않을 수 있습니다.')],{head:['방법','돈을 쓸 조건','비교할 점'],rows:[['입출금 예금','필요할 때 인출','유동성 높음 · 이자는 상대적으로 적을 수 있음'],['1년 정기예금','만기 또는 중도 해지','약정 이자 · 해지 시 이자 감소'],['주식·펀드','매도·환매 조건 확인','가격·대금 지급 시점이 달라짐']]},'안전성과 유동성은 어떻게 다른가요? 다음 달 지출에 필요한 돈과 나중에 사용할 돈을 나누는 이유를 선택한 목표와 연결하세요.'),task('원금과 높은 수익을 동시에 보장한다면?',`${state.traits[3]===1?'지인과 투자 모임에서':'온라인 광고에서'} ${n}에게 ‘원금 보장, 높은 수익, 오늘만 입금 가능’이라는 제안을 합니다. 상품 구조·회사의 등록 여부·계약 내용은 아직 확인하지 못했습니다. 노후 생활비가 걸린 결정입니다.`, '안전성 · 수익성 · 합리적 선택',[
 option('송금 전에 공식 정보 확인','압박에 따르지 않는다. 회사와 상품을 공식 경로로 확인하고 계약·손실 가능성을 이해하지 못하면 참여하지 않는다.',[12,6,8,0],[2,2,2,2],'수익 주장과 확인된 사실을 구분해 생활자금의 위험을 점검했습니다.'),
 option('송금은 보류하고 상담으로 교차 확인','가족·신뢰할 수 있는 상담의 도움을 받되 공식 정보와 계약을 함께 확인하고 결정을 미룬다.',[10,6,8,4],[2,2,2,2],'조언 자체를 보장으로 여기지 않고 사실을 교차 확인했습니다.'),
 option('남들이 받았다니 우선 송금','추천과 후기만 믿고 생활자금 일부를 오늘 입금한다. 자세한 내용은 나중에 확인한다.',[-22,-10,-18,0],[0,0,0,0],'확인되지 않은 수익 주장에 의존해 노후 자금을 위험에 노출했습니다. 실제 손실 발생을 단정하는 것은 아닙니다.')],null,'안전성과 수익성 사이의 관계를 설명하세요. 높은 기대수익과 수익 보장은 왜 다른 말인가요? 어떤 정보를 확인해야 합리적 선택이 될까요?')];}
 return {age:AGES[i],intro,goal:state.goals[i].text,type:g.title,guide:[1,2,3,4,5,5][i],tasks:q};
}
function goalAssetTask(i,n,g){const near=g.months<=36,years=g.months/12,ethical=state.priority==='ethical';return task(`‘${g.title}’ 자금의 금융상품을 고른다면?`,`${n}은 ${years}년 뒤 목표 자금을 써야 합니다. 생활비와 기본 비상금은 따로 있고, 이번 상황에서는 목표 준비금 ${Math.min(g.cost,1200).toLocaleString('ko-KR')}만 원을 운용합니다. ${near?'사용 시기를 쉽게 늦추기 어렵습니다.':'오래 두고 정기적으로 점검할 여지가 있습니다.'} ${ethical?'기업의 사회적 책임도 중요하지만 손실 위험과 재무정보를 함께 확인해야 합니다.':PRIORITIES[state.priority].desc}`, '안전성 · 수익성 · 유동성 · 예금·적금 · 분산 투자',[
 option('예금·적금 중심으로 사용 시기 맞추기','만기·중도 해지·보호 조건을 확인해 목표 자금을 관리한다. 장기 자금이라면 물가 영향도 정기적으로 살핀다.',[12,near?16:10,6,0],[2,2,near?2:1,2],near?'가까운 시기에 필요한 자금의 안전성과 사용 시기를 우선했습니다.':'안정성을 우선했지만 긴 기간의 구매력과 성장 기회도 살필 과제가 있습니다.'),
 option('사용 시기별로 예금과 분산 자산 나누기',near?'목표에 꼭 필요한 돈은 예금으로 두고, 늦게 써도 되는 일부만 주식·채권·펀드의 구조와 비용을 비교해 운용한다.':'가까운 지출은 예금으로 두고, 오래 두어도 되는 돈은 주식·채권·펀드의 위험과 비용을 비교해 분산한다.',[7,near?13:17,12,0],[2,2,2,2],'같은 인물도 돈을 쓰는 시기에 따라 안전성·수익성·유동성의 비중을 달리할 수 있다는 점을 고려했습니다.'),
 option('높은 수익이 기대되는 한 주식에 집중','목표 자금 전부를 한 기업에 투자한다. 목표 시점에 주가가 낮으면 그때 다시 고민한다.',[-13,near?-8:2,1,0],[0,0,0,0],'기대수익만 보고 목표 시점의 부족 가능성과 집중 위험을 놓쳤습니다.')],{head:['비교 기준','질문'],rows:[['안전성','자산 가치가 줄어들 위험은?'],['수익성','이자·배당·시세 차익을 얼마나 기대하는가?'],['유동성','필요한 시기에 현금으로 사용할 수 있는가?']]},`선택한 목표까지 ${years}년이 남았습니다. 세 자산 관리 원칙 중 무엇을 우선했나요? ${ethical?'사회적 가치도 보되 금융 위험을 따로 확인해야 하는 이유를 포함하세요.':'높은 수익을 기대하는 대신 어떤 위험을 감수하는지 설명하세요.'}`);}

function clamp(n){return Math.max(0,Math.min(100,n));}
function simulate(revised=false,limit=6){let indices={buffer:45,goal:35,pension:25,experience:35},history=[],sums=[0,0,0,0],count=0;for(let i=0;i<limit;i++){const stage=makeStage(i,indices),r=state.records[i],rev=state.review.revisions[i];const choices=revised&&rev.enabled?rev.choices:r.choices;let outcomes=[];for(let j=0;j<2;j++){const k=choices[j];if(k===null)continue;const o=stage.tasks[j].options[k];if(!o)continue;['buffer','goal','pension','experience'].forEach((key,z)=>indices[key]=clamp(indices[key]+o.effect[z]));o.ratings.forEach((s,z)=>sums[z]+=s);count++;outcomes.push(o.outcome);}history.push({stage,choices:[...choices],outcomes,indices:{...indices},revised:revised&&rev.enabled});}return {indices,history,sums,count};}
function analyze(revised=false){const sim=simulate(revised);const names=['생활 안전','사용 시기 적합성','장기 균형','정보·위험 점검'];let parts=sim.sums.map((v,i)=>({name:names[i],value:sim.count?Math.round(v/(sim.count*2)*25):0}));const score=parts.reduce((a,p)=>a+p.value,0);return {...sim,parts,score};}
function lifeSummary(a){let k=a.indices;return `${state.name}의 설계는 ${k.buffer>=65?'예상하지 못한 지출에 대응할 여유를 남기는':k.buffer>=40?'기본적인 생활 여유를 유지하되 큰 지출에는 조정이 필요한':'예상하지 못한 지출이 생기면 생활을 크게 조정해야 하는'} 흐름입니다. ${k.pension>=65?'노후 준비를 이어 가 은퇴 이후의 선택 폭을 넓혔습니다.':k.pension>=40?'노후 준비를 일부 이어 갔지만 부족한 시기의 보완이 필요합니다.':'노후 준비를 미룬 선택이 쌓여 은퇴 이후 생활비·돌봄 비용 마련이 과제로 남았습니다.'} ${k.experience>=65?'경험과 관계에도 자원을 많이 배분했습니다.':k.experience>=40?'경험과 관계를 일정 부분 유지했습니다.':'현재의 경험·관계에 쓰는 여유가 적어 삶의 만족도 함께 돌아볼 필요가 있습니다.'}`;}
function metricCards(a){const names={buffer:'생활 대응 여유',goal:'목표 준비 기반',pension:'노후 준비 기반',experience:'경험·관계 여유'};return `<div class="four">${Object.keys(names).map(k=>`<div class="stat"><small>${names[k]}</small><b>${a.indices[k]} <small>/ 100</small></b><div class="track"><i style="width:${a.indices[k]}%"></i></div></div>`).join('')}</div><p class="muted" style="font-size:12px;margin-top:10px">가상 지표의 변화입니다. 실제 자산·수익률·행복 점수가 아닙니다. 경험·관계 지표는 금융 점수에 포함하지 않습니다.</p>`;}
function renderNav(){const tabs=[['profile','① 인물·성향·목표'],['journey','② 생애 금융 선택'],['result','③ 삶의 결과'],['review','④ 평가·수정'],['report','⑤ 발표 보고서']];document.getElementById('nav').innerHTML=tabs.map(([v,n])=>`<button class="${state.view===v?'active':''}" onclick="goto('${v}')" ${v!=='profile'&&!profileReady()||['result','review','report'].includes(v)&&!completed()?'disabled':''}>${n}</button>`).join('');}
function render(){renderNav();const screen=document.getElementById('screen');screen.innerHTML=({profile:profileHTML,journey:journeyHTML,result:resultHTML,review:reviewHTML,report:reportHTML}[state.view]||profileHTML)();save();}
function profileHTML(){return `<section class="hero"><span class="badge">선택으로 인물 만들기 · 통합사회2</span><h1 style="margin:14px 0">한 사람의 삶,<br>여섯 번의 금융 설계.</h1><p>어떤 일을 하고, 무엇을 중요하게 여기며, 어떤 목표를 준비할까요?<br>처음에는 선택으로 정하고, 생애 속 결정에서는 교과 개념으로 이유를 설명합니다.</p><button class="ghost mini" onclick="fillDemo()">교사용 예시 · 전체 과정 살펴보기</button></section>
<div class="card"><h2>01. 인물의 삶과 투자 기준</h2><div class="cols"><div><label for="team">모둠 이름 *</label><input id="team" maxlength="60" value="${E(state.team)}" oninput="field('team',this.value)" placeholder="예: 미래를 설계하조"><label for="members">모둠원</label><input id="members" maxlength="160" value="${E(state.members)}" oninput="field('members',this.value)" placeholder="학번 또는 이름"><label for="name">가상 인물 이름 *</label><input id="name" maxlength="40" value="${E(state.name)}" oninput="field('name',this.value)" placeholder="예: 김미래"><label for="job">일·소득의 형태</label><select id="job" onchange="field('job',this.value)">${Object.entries(JOBS).map(([k,v])=>`<option value="${k}" ${state.job===k?'selected':''}>${v}</option>`).join('')}</select><p class="muted" style="font-size:13px;margin-top:8px">${JOB_META[state.job].desc}</p></div><div><label for="family">30대 이후 계획한 생활 형태</label><select id="family" onchange="field('family',this.value)">${Object.entries(FAMILIES).map(([k,v])=>`<option value="${k}" ${state.family===k?'selected':''}>${v}</option>`).join('')}</select><label for="life">이 인물이 중요하게 여기는 삶</label><select id="life" onchange="field('life',this.value)">${Object.entries(LIFE).map(([k,v])=>`<option value="${k}" ${state.life===k?'selected':''}>${v}</option>`).join('')}</select><label for="priority">투자·돈 관리에서 먼저 보는 기준</label><select id="priority" onchange="field('priority',this.value)">${Object.entries(PRIORITIES).map(([k,v])=>`<option value="${k}" ${state.priority===k?'selected':''}>${v.name}</option>`).join('')}</select><div class="soft" style="margin-top:12px"><b>${PRIORITIES[state.priority].name}</b><p style="margin:7px 0 0">${PRIORITIES[state.priority].desc}</p></div><small>안전성·수익성·유동성은 함께 비교합니다. 성향 자체에는 점수를 매기지 않습니다.</small></div></div></div>
<div class="card"><h2>02. 이 인물은 어떤 투자자일까?</h2><p class="muted">모둠이 만든 인물이 어떻게 생각할지 선택하세요. 특정 성향을 더 좋은 것으로 평가하지 않습니다.</p>${TRAITS.map((t,i)=>`<div class="question"><h3>${i+1}. ${t.q}</h3><div class="choice2">${[0,1].map(v=>`<button class="option ${state.traits[i]===v?'selected':''}" aria-pressed="${state.traits[i]===v}" onclick="trait(${i},${v})">${t[v===0?'a':'b']}</button>`).join('')}</div></div>`).join('')}<div class="soft" aria-live="polite"><span class="badge">우리 인물의 투자·금융 성향</span><h2 style="margin:10px 0">${typeCode()}</h2>${state.traits.every(x=>x!==null)?`<p>${E(typeDescription())}</p><small>${typeNames()}</small>`:'<p>위의 네 가지 선택을 마치면 이 인물의 성향과 이유를 설명해 줍니다.</p>'}<p class="muted" style="font-size:12px;margin:10px 0 0">선택을 정리한 수업용 설명입니다. 검사 결과나 실제 금융상품 가입 기준은 아닙니다.</p></div></div>
<div class="card"><h2>03. 생애주기별 우선 목표 — 하나씩 선택</h2><p>각 시기에 가장 먼저 준비할 목표를 고르세요. <b>금액·기간이 함께 정해지고, 뒤의 상황과 비교 기준에 반영됩니다.</b></p><div class="cols">${AGES.map((age,i)=>`<div class="question" style="margin:0"><h3>${age}</h3><label for="goal-select${i}">우선 목표 *</label><select id="goal-select${i}" onchange="setGoal(${i},this.value)"><option value="">선택하세요</option>${GOAL_CATALOG[i].map(g=>`<option value="${g.id}" ${state.goals[i].id===g.id?'selected':''}>${g.title}</option>`).join('')}</select>${state.goals[i].id?`<p style="margin:12px 0 6px">${E(state.goals[i].text)}</p><span class="pill">${goalSpec(i).cost.toLocaleString('ko-KR')}만 원</span><span class="pill">${goalSpec(i).months}개월</span>`:'<p class="muted" style="margin:12px 0 0">주관식 없이 선택하면 됩니다.</p>'}</div>`).join('')}</div><p class="muted" style="margin-top:16px;font-size:13px">금액과 기간은 수업용 가정입니다. 자녀가 없는 경우 ‘교육·배움’은 본인의 배움 비용으로 해석할 수 있습니다.</p><button id="start-journey" ${profileReady()?'':'disabled'} onclick="goto('journey')">이 인물의 생애 금융 선택 시작 →</button></div>
<details class="card source-list"><summary>교사용 안내 · 개념 연결과 결과 산출</summary><p>제공된 통합사회 부교재 「금융 생활과 의사 결정」의 금융자산·자산 관리 원칙·생애주기 설계·경제 환경 변화와 연결했습니다. 정확한 교과서 본문 전체는 제공받지 않아 부교재의 개념 범위를 기준으로 구성했습니다. 부교재의 제도 수치·일률적인 상품 순위는 그대로 옮기지 않았습니다.</p><table><thead><tr><th>시기</th><th>주요 개념·판단</th></tr></thead><tbody><tr><td>20대</td><td>소득·소비·저축, 합리적 선택, 안전성·수익성·유동성</td></tr><tr><td>30대</td><td>금리 변화와 대출 비용, 보험의 위험 보장 기능</td></tr><tr><td>40대</td><td>물가와 구매력, 주식·채권·펀드, 분산 투자</td></tr><tr><td>50대</td><td>사용 시기, 채권의 이자·가격, 금리·유동성</td></tr><tr><td>60대</td><td>연금과 현금흐름, 환율과 외화 자산</td></tr><tr><td>70대 이상</td><td>유동성·안전성, 정보 확인과 수익·위험 관계</td></tr></tbody></table><p>금융감독원 가이드북의 시기별 재무 과제도 참고했습니다. 업로드한 BRF 본문은 직접 해독하지 못해 일반 PDF본을 확인했습니다. 5단계 주제를 수업을 위해 6개 연령대로 구성했으며, 연령과 생애 사건이 반드시 일치하는 것은 아닙니다.</p>${sourceLinks()}<p>12가지 선택의 생활 안전·사용 시기 적합성·장기 균형·정보 점검을 각각 0~2점으로 평가해 분야별 25점으로 환산합니다. 같은 점수의 대안도 있으며 삶의 가치·성향·직업 자체에는 점수를 매기지 않습니다. 학생의 이유는 자동으로 내용 채점하지 않으므로 자료 활용과 개념 설명을 교사가 평가합니다.</p><p>여유 지표는 생활 45 / 목표 35 / 노후 25 / 경험 35에서 출발해 가상 변화값을 더합니다(0~100). 제시된 이자·물가·환율 계산은 사례 비교이며, 전체 생애의 실제 수익이나 자산은 계산하지 않습니다.</p><p>기존 1차 버전 기록은 그 버전의 HTML에서 확인하세요. 이 수정본은 질문이 달라 새 기록으로 시작합니다. 설정·목표를 바꾸면 기존 선택을 다시 확정해야 합니다.</p><p>수정 위치: 직업 JOBS·JOB_META / 우선순위 PRIORITIES / 목표 GOAL_CATALOG / 개념 CONCEPTS / 상황 makeStage / 보고서 buildReport.</p></details>`;}
function journeyHTML(){const i=state.age,before=simulate(false,i),stage=makeStage(i,before.indices),r=state.records[i];return `<div class="actions"><div><span class="badge">${E(state.team)} · ${E(state.name)} · ${typeCode()}</span><h1 style="font-size:34px;margin:12px 0 0">${AGES[i]}의 금융 선택</h1></div><small>확정 ${state.records.filter(r=>r.confirmed).length} / 6 단계</small></div><div class="age-tabs">${AGES.map((age,z)=>`<button class="${z===i?'active':''} ${state.records[z].confirmed?'done':''}" onclick="ageGo(${z})">${age}${state.records[z].confirmed?' ✓':''}</button>`).join('')}</div><div class="card"><p>${E(stage.intro)}</p><div class="soft"><b>처음 정한 ${AGES[i]} 목표</b><p style="margin:7px 0 0">${E(stage.goal)}</p></div>${i?`<p class="muted" style="margin:15px 0 0">이전 선택의 흔적: 생활 대응 여유 ${before.indices.buffer} · 노후 준비 기반 ${before.indices.pension} / 100</p>`:''}</div>${stage.tasks.map((q,j)=>`<div class="card"><span class="badge">선택 ${j+1} / 2</span><h2 style="margin-top:12px">${E(q.title)}</h2><p>${E(q.story)}</p><p><span class="pill">활용할 개념: ${E(q.concept)}</span></p>${tableHTML(q)}${conceptHTML(q)}<div class="options">${q.options.map((o,k)=>`<button class="option ${r.choices[j]===k?'selected':''}" aria-pressed="${r.choices[j]===k}" onclick="choose(${j},${k})"><strong>${'ABC'[k]}. ${E(o.title)}</strong>${E(o.desc)}</button>`).join('')}</div><div class="notice"><b>생각할 질문</b><br>${E(q.prompt||'목표·사용 시기와 연결하여 선택의 편익과 포기한 기회를 비교하세요.')}</div><label for="reason${j}">개념을 활용한 선택 이유 *</label><textarea id="reason${j}" maxlength="4000" oninput="writeReason(${j},this.value)" placeholder="① 선택한 대안 ② 자료의 숫자·상황 ③ 개념을 적용한 이유 ④ 포기한 대안의 비용을 연결해 2~3문장으로 설명하세요.">${E(r.reasons[j])}</textarea></div>`).join('')}<div class="notice">선택을 확정하면 다음 시기로 이어집니다. 이전 시기의 선택을 다시 확정하면 뒤의 상황과 기록은 초기화됩니다. 완주 후에는 ‘평가·수정’ 탭에서 원래 기록을 보존하며 수정할 수 있습니다.</div><div class="actions"><button class="ghost" onclick="${i?'ageGo('+ (i-1)+')':"goto('profile')"}">← ${i?'앞 시기':'인물 설정'}</button><button id="confirm-stage" ${r.choices.every(x=>x!==null)&&r.reasons.every(x=>x.trim())?'':'disabled'} onclick="confirmStage()">${i===5?'확정하고 삶의 결과 보기':'확정하고 '+AGES[i+1]+'로 이동'} →</button></div>`;}
function resultHTML(){const a=analyze();return `<div class="hero"><span class="badge">선택이 쌓여 만들어진 삶</span><h1>${E(state.name)}은<br>어떤 삶을 설계했을까?</h1><p>${E(lifeSummary(a))}</p></div><div class="card"><div class="cols"><div><h2>금융 설계 점수</h2><div class="big-number">${a.score}<small style="font-size:20px"> / 100</small></div><p class="muted">수익이나 성향의 점수가 아니라,<br>상황에 맞춰 위험과 목표를 고려한 정도입니다.</p></div><div>${a.parts.map(p=>`<p style="margin-bottom:7px"><b>${p.name}</b> ${p.value} / 25</p><div class="track"><i style="width:${p.value*4}%"></i></div>`).join('')}</div></div><details><summary>점수 계산 근거</summary><p>각 선택에 4개 항목별 0~2점이 있습니다. 12개 선택을 항목별로 평균 내 25점으로 환산한 뒤 합산합니다. 결과는 수업용이며, 서술 이유의 질은 선생님과 모둠이 판단합니다.</p></details></div>${metricCards(a)}<h2 style="margin-top:28px">한 사람의 삶을 따라가 보기</h2><div class="timeline">${a.history.map((h,i)=>`<div class="card"><span class="badge">${AGES[i]}</span><h3 style="margin-top:12px">목표: ${E(state.goals[i].text)}</h3>${h.outcomes.map(o=>`<p>${E(o)}</p>`).join('')}<details><summary>우리의 선택과 이유</summary>${h.stage.tasks.map((q,j)=>`<p><b>${E(q.options[h.choices[j]].title)}</b><br>${E(state.records[i].reasons[j])}</p>`).join('')}</details></div>`).join('')}</div><div class="notice">목표 문장을 적었다고 목표가 실제로 달성된 것은 아닙니다. 결과는 선택에 따른 가능성과 부담을 설명합니다. 어떤 삶이 더 좋은지는 모둠의 가치와 근거를 들어 평가하세요.</div><button onclick="goto('review')">우리의 설계를 평가하고 고치기 →</button>`;}
function reviewField(k,v){state.review[k]=v;save();}
function toggleRevision(i,on){let r=state.review.revisions[i];r.enabled=on;if(on&&r.choices.some(x=>x===null))r.choices=[...state.records[i].choices];save();render();}
function revisionChoice(i,j,v){state.review.revisions[i].choices[j]=Number(v);save();render();}
function revisionReason(i,v){state.review.revisions[i].reason=v;save();}
function reviewHTML(){const original=analyze(),modified=analyze(true);return `<h1 style="font-size:34px;margin-top:25px">우리의 선택은 현명했을까?</h1><p class="muted">높은 점수만 따르기보다, 인물이 원하는 삶과 위험을 함께 평가합니다.</p><div class="card"><h2>01. 자기평가</h2><label for="verdict">우리 모둠의 판단 *</label><select id="verdict" onchange="reviewField('verdict',this.value)"><option value="">선택하세요</option>${['대체로 현명했다','좋은 선택과 보완할 선택이 함께 있었다','수정이 많이 필요하다'].map(x=>`<option ${state.review.verdict===x?'selected':''}>${x}</option>`).join('')}</select><label for="evidence">그렇게 평가한 근거 *</label><textarea id="evidence" maxlength="5000" oninput="reviewField('evidence',this.value)" placeholder="가장 잘한 선택 1개와 보완할 선택 1개를 연령·목표·위험과 연결해 설명하세요.">${E(state.review.evidence)}</textarea></div><div class="card"><h2>02. 선택을 바꾸고 결과 비교하기</h2><p>수정할 연령을 체크하세요. 원래 선택과 이유는 보존됩니다. 바꿀 필요가 없다면 체크하지 않아도 됩니다.</p>${AGES.map((age,i)=>{let rev=state.review.revisions[i],st=makeStage(i,simulate(true,i).indices);return `<div class="question"><label style="margin:0"><input type="checkbox" style="width:auto;margin-right:8px" ${rev.enabled?'checked':''} onchange="toggleRevision(${i},this.checked)">${age} 수정하기</label>${rev.enabled?st.tasks.map((q,j)=>`<label for="rev${i}${j}">${E(q.title)}</label><p class="muted" style="margin-bottom:7px">원래: ${E(q.options[state.records[i].choices[j]].title)}</p><select id="rev${i}${j}" onchange="revisionChoice(${i},${j},this.value)">${q.options.map((o,k)=>`<option value="${k}" ${rev.choices[j]===k?'selected':''}>${'ABC'[k]}. ${E(o.title)}</option>`).join('')}</select>`).join('')+`<label for="revreason${i}">왜 바꾸는가? 어떤 삶을 더 잘 준비하는가? *</label><textarea id="revreason${i}" maxlength="5000" oninput="revisionReason(${i},this.value)">${E(rev.reason)}</textarea>`:''}</div>`}).join('')}<div class="cols"><div class="soft"><b>원래 설계</b><p style="font-size:30px;margin:0">${original.score} / 100</p><small>생활 ${original.indices.buffer} · 노후 ${original.indices.pension} · 경험 ${original.indices.experience}</small></div><div class="soft"><b>수정 설계</b><p style="font-size:30px;margin:0">${modified.score} / 100 <small style="font-size:16px">(${modified.score-original.score>=0?'+':''}${modified.score-original.score})</small></p><small>생활 ${modified.indices.buffer} · 노후 ${modified.indices.pension} · 경험 ${modified.indices.experience}</small></div></div><p style="margin-top:16px">${E(lifeSummary(modified))}</p><small>앞 시기의 수정은 뒤의 생활 대응 조건과 일부 결과에도 반영됩니다. 점수가 같아도 경험·관계의 여유는 달라질 수 있습니다.</small></div><div class="card"><h2>03. 탐구 후 성찰</h2><label for="reflection">느낀점 · 처음 생각과 달라진 점 *</label><textarea id="reflection" maxlength="6000" oninput="reviewField('reflection',this.value)" placeholder="돈을 많이 모으는 것과 원하는 삶을 사는 것 사이에서 무엇을 배웠나요? 어떤 선택이 가장 어려웠나요?"></textarea><label for="principle">우리 모둠이 찾은 현명한 금융생활의 원칙 한 문장 *</label><textarea id="principle" maxlength="2000" oninput="reviewField('principle',this.value)" placeholder="현명한 금융생활이란 …이다.">${E(state.review.principle)}</textarea><div class="actions"><button class="ghost" onclick="goto('result')">← 결과 돌아보기</button><button onclick="goto('report')">발표 보고서 확인 →</button></div></div>`;}
function sourceLinks(){const names=['사회초년기','신혼기 및 자녀출산기','자녀학령기','자녀성년기 및 독립기','은퇴기'];return `<ul>${names.map((n,i)=>`<li><a href="https://lifeinsedu.or.kr/Content/Areas/FinanceKnow/Fadult/0${i+1}_lifecycle.pdf" target="_blank" rel="noopener">금융감독원 가이드북 ${i+1}권 · ${n}</a></li>`).join('')}</ul>`;}
function buildReport(){const a=analyze(),b=analyze(true);let revised=state.review.revisions.some(r=>r.enabled);return `<article class="report"><span class="badge">통합사회2 · 생애주기별 금융생활 탐구</span><h1 class="report-title" style="margin:12px 0">${E(state.name||'가상 인물')}의 생애 금융 설계</h1><p><b>모둠:</b> ${txt(state.team)}　 <b>모둠원:</b> ${txt(state.members)}<br><b>인물:</b> ${txt(state.name)} / ${JOBS[state.job]} / ${FAMILIES[state.family]}<br><b>중요한 삶:</b> ${LIFE[state.life]} / <b>투자 우선순위:</b> ${PRIORITIES[state.priority].name}<br><b>출발 성향:</b> ${typeCode()} · ${typeNames()}</p>${!completed()||!reviewReady()?'<div class="notice">작성 중 보고서입니다. 미작성 항목을 확인하세요.</div>':''}<h2>1. 한눈에 보는 생애 설계</h2><table><colgroup><col style="width:10%"><col style="width:34%"><col style="width:38%"><col style="width:18%"></colgroup><thead><tr><th>시기</th><th>원하는 삶·금융 목표</th><th>원래 선택</th><th>수정</th></tr></thead><tbody>${a.history.map((h,i)=>`<tr><td><b>${AGES[i]}</b></td><td>${txt(state.goals[i].text)}<br><small>${goalSpec(i).cost.toLocaleString('ko-KR')}만 원 · ${goalSpec(i).months}개월</small></td><td>${h.stage.tasks.map((q,j)=>`${j+1}. ${h.choices[j]===null?'미선택':E(q.options[h.choices[j]].title)}`).join('<br>')}</td><td>${state.review.revisions[i].enabled?b.history[i].stage.tasks.map((q,j)=>`${j+1}. ${E(q.options[b.history[i].choices[j]]?.title||'미선택')}`).join('<br>'):'유지'}</td></tr>`).join('')}</tbody></table><div class="report-section"><h2>2. 삶의 결과 요약</h2><p><b>원래 점수 ${a.score}/100 → ${revised?'수정':'유지'} 점수 ${b.score}/100</b><br>${a.parts.map(p=>`${p.name} ${p.value}/25`).join(' · ')}</p><p><b>원래 설계:</b> ${E(lifeSummary(a))}</p>${revised?`<p><b>수정 설계:</b> ${E(lifeSummary(b))}</p>`:''}<p><b>최종 원칙:</b> ${txt(state.review.principle)}</p></div><p style="font-size:9pt;color:#687872">뒤에는 각 시기의 상황·선택·근거·결과와 자기평가·수정·성찰을 모두 담았습니다. 실제 미래 예측이나 공식 검사 결과가 아닙니다.</p>${a.history.map((h,i)=>`<section class="report-age"><span class="badge">선택 과정 ${i+1} / 6</span><h2>${AGES[i]} · ${E(state.name)}</h2><p><span class="report-label">처음 목표</span><br>${txt(state.goals[i].text)}<br>${goalSpec(i).cost.toLocaleString('ko-KR')}만 원 · ${goalSpec(i).months}개월</p><p>${E(h.stage.intro)}</p>${h.stage.tasks.map((q,j)=>`<h3>${j+1}. ${E(q.title)}</h3><p><span class="report-label">상황</span> ${E(q.story)}</p><p><span class="report-label">활용할 개념</span> ${E(q.concept)}</p>${tableHTML(q)}<p><span class="report-label">탐구 질문</span> ${E(q.prompt||'')}</p><p><span class="report-label">모둠의 선택</span><br>${h.choices[j]===null?'미선택':E(q.options[h.choices[j]].title)+' — '+E(q.options[h.choices[j]].desc)}</p><p><span class="report-label">선택 이유</span><br>${txt(state.records[i].reasons[j])}</p><p><span class="report-label">남긴 여유와 부담</span><br>${E(h.outcomes[j]||'미선택')}</p>`).join('')}${state.review.revisions[i].enabled?`<h3>이 시기의 수정</h3><p>${b.history[i].stage.tasks.map((q,j)=>`${j+1}. ${E(q.options[b.history[i].choices[j]]?.title||'미선택')}`).join('<br>')}</p><p><span class="report-label">수정 근거</span><br>${txt(state.review.revisions[i].reason)}</p><p>${b.history[i].outcomes.map(E).join('<br>')}</p>`:''}</section>`).join('')}<section class="reflection-print report-section"><h2>3. 자기평가와 성찰</h2><h3>우리의 금융생활은 현명했는가?</h3><p>${txt(state.review.verdict)}</p><p>${txt(state.review.evidence)}</p><h3>무엇을 고쳤는가?</h3><p>${revised?state.review.revisions.map((r,i)=>r.enabled?`${AGES[i]}: ${txt(r.reason)}`:'').filter(Boolean).join('<br><br>'):'선택을 유지했다. 유지 이유는 위의 자기평가 근거에 기록한다.'}</p><h3>느낀점 · 달라진 생각</h3><p>${txt(state.review.reflection)}</p><h3>현명한 금융생활의 원칙</h3><p>${txt(state.review.principle)}</p><h3>점수의 의미</h3><p>12개 선택을 생활 안전, 사용 시기 적합성, 장기 균형, 정보·위험 점검의 4항목으로 평가했다. 각 선택의 항목별 0~2점을 평균 내 항목별 25점으로 환산·반올림한 뒤 합산했다. 성향·가족 형태·서술 길이는 자동 채점하지 않았다. 실제 수익·자산·행복을 나타내지 않는 수업용 지표이다.</p><h3>참고 자료</h3><div class="source-list">${sourceLinks()}</div><small>제공된 통합사회 부교재의 「금융 생활과 의사 결정」과 금융감독원 가이드북 일반 PDF본을 참고했다. 상황의 인물·금액·변화값·선택지·점수는 수업용으로 새로 구성했다.</small></section></article>`;}
function reportHTML(){return `<div class="actions"><div><h1 style="font-size:32px;margin:18px 0 7px">우리 모둠의 발표 보고서</h1><p class="muted">요약표 → 생애 선택 과정 → 평가·수정·성찰</p></div><button onclick="printReport()">PDF로 저장 / 인쇄</button></div><div class="notice">버튼을 누른 뒤 인쇄 창의 ‘대상’을 ‘PDF로 저장’으로 선택하세요. A4 세로, 배율 100%, 머리글·바닥글 해제를 권장합니다. 긴 글은 다음 페이지로 이어지며 내용을 자르지 않습니다.</div><div class="actions"><button class="outline" onclick="downloadHTML()">작성한 내용 포함 HTML 저장</button><span class="muted">다른 기기에서 이어 쓰려면 작성 기록(JSON)을 저장하세요.</span></div>${buildReport()}`;}
function printReport(){if(!completed()){notify('생애 선택을 먼저 모두 확정하세요.');return}if(!reviewReady()){notify('자기평가·수정 이유·느낀점·원칙을 모두 작성한 뒤 출력하세요.');return}document.getElementById('print-area').innerHTML=buildReport();const old=document.title;document.title=`${state.team}_${state.name}_생애금융설계`;window.print();document.title=old;}
window.addEventListener('beforeprint',()=>document.getElementById('print-area').innerHTML=buildReport());
function download(content,name,type){const url=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement('a');a.href=url;a.download=name.replace(/[\\/:*?"<>|]/g,'_');a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);}
function backup(){download(JSON.stringify(state,null,2),`${state.team||'모둠'}_${state.name||'인물'}_금융탐구기록.json`,'application/json');notify('작성 기록을 파일로 저장했습니다.');}
async function restore(input){const f=input.files[0];if(!f)return;try{if(f.size>3000000)throw Error('파일이 너무 큽니다.');const s=JSON.parse(await f.text());if(s.version===1)throw Error('이전 버전은 질문이 달라 그대로 적용할 수 없습니다. 기존 HTML에서 기록을 확인하세요.');if(!validState(s))throw Error('이 활동의 유효한 기록 파일이 아닙니다.');if(!confirm('현재 기록을 불러온 기록으로 바꿀까요?'))return;state=s;normalizeView();save();render();notify('작성 기록을 불러왔습니다.');}catch(e){notify('불러오기 실패: '+e.message)}finally{input.value='';}}
function downloadHTML(){const doc=document.documentElement.cloneNode(true);doc.querySelector('#embedded-data').textContent=JSON.stringify(state).replace(/</g,'\\u003c');doc.querySelector('#print-area').innerHTML='';doc.querySelector('#screen').innerHTML='';doc.querySelector('#nav').innerHTML='';doc.querySelector('#toast').style.display='none';download('<!doctype html>\n'+doc.outerHTML,`${state.team||'모둠'}_${state.name||'인물'}_금융탐구.html`,'text/html;charset=utf-8');}
function fillDemo(){if((state.team.trim()||state.name.trim())&&!confirm('현재 기록을 예시 모둠의 기록으로 바꿀까요? 현재 기록을 보관하려면 먼저 작성 기록을 저장하세요.'))return;state=blank();state.team='예시 모둠';state.members='교사용 살펴보기';state.name='김미래';state.job='flex';state.family='solo';state.life='experience';state.priority='growth';state.traits=[1,0,1,0];const reasons=[['월 30만 원씩 120개월 모으면 3,600만 원이 된다. 월 배분 가능액 80만 원 안에서 준비할 수 있고 나머지는 비상금과 경험에 남기겠다.','높은 수익성을 기대해 한 주식에 집중했다. 장기 목표이므로 가격 변동을 견딜 수 있다고 생각했지만 기업 한 곳의 위험을 충분히 따지지 않았다.'],['6,000만 원의 월 이자가 20만 원에서 30만 원으로 늘었다. 대출 규모를 4,000만 원으로 줄이면 6%에서도 월 이자가 20만 원이므로 다른 목표 저축에 여유를 남길 수 있다.','보험은 사고의 손실을 보장하는 기능이다. 기존 보장과 중복을 확인해 불필요한 보험료가 목표 저축을 줄이지 않게 하겠다.'],['예금 이자율 2%보다 목표 가격 상승률 4%가 높다. 명목 잔액이 늘어도 필요한 물건의 가격을 따라가지 못하므로 목표 금액과 저축 계획을 수정하겠다.','한 기업의 가격 하락 위험을 낮추기 위해 여러 기업과 자산에 분산하겠다. 펀드도 투자 대상과 비용을 확인해야 하며 전체 시장의 하락 위험은 남는다.'],['목표까지 남은 시간과 예금 만기를 비교하겠다. 원금 변동을 낮추는 안전성과 필요한 때 쓸 유동성을 우선하되 장기 구매력도 점검하겠다.','새 채권의 이자가 더 높으면 기존 채권은 매입 가격으로 바로 팔기 어려울 수 있다. 만기와 중도 매도를 구분하고 생활비 현금을 별도로 남기겠다.'],['연금 등 정기 소득 180만 원보다 생활비 220만 원이 많다. 지출을 200만 원으로 줄이고 부족한 20만 원의 소득·인출 계획을 확인하겠다.','같은 1,000달러도 환율이 1,450원이면 145만 원, 1,200원이면 120만 원이다. 원화 생활비는 따로 남기고 외화 자산 비중을 점검하겠다.'],['다음 달 지출에 필요한 300만 원은 입출금이 쉬운 예금에 남기겠다. 안전한 정기예금도 중도 해지 조건에 따라 필요한 시기에 불리할 수 있다.','높은 기대수익은 수익 보장과 다르다. 회사와 상품 구조를 공식 경로로 확인하기 전에는 노후 생활자금을 송금하지 않겠다.']];for(let i=0;i<6;i++){let g=defaultGoal(i);state.goals[i]={type:g[0],text:g[1],id:g[2]};state.records[i]={choices:[0,i===0?2:0],reasons:reasons[i],confirmed:true};}state.review.verdict='좋은 선택과 보완할 선택이 함께 있었다';state.review.evidence='20대에 한 주식에 목표 자금 전부를 넣은 선택은 집중 위험이 크다. 30대에는 금리 상승으로 늘어난 이자를 계산하고 대출 규모를 줄인 점이 좋았다.';state.review.revisions[0]={enabled:true,choices:[0,1],reason:'성장 기회를 추구하더라도 특정 기업의 위험을 모두 떠안을 필요는 없다. 사용 시기별로 예금과 분산 자산을 나누겠다.'};state.review.reflection='같은 성장 성향이어도 모든 돈을 한 주식에 넣는 것은 합리적이지 않았다. 금융상품의 기능과 금리·물가·환율 변화, 돈을 사용할 시기를 함께 확인해야 했다.';state.review.principle='현명한 금융생활이란 원하는 삶을 위해 자산 관리의 세 원칙과 경제 환경 변화를 함께 고려하고 계획을 수정하는 것이다.';state.view='result';save();render();window.scrollTo(0,0);notify('교사용 예시입니다. 인물·선택·수정 내용을 살펴보세요.');}
function resetAll(){if(confirm('모둠·인물·모든 선택과 성찰을 삭제할까요? 먼저 작성 기록을 저장할 수 있습니다.')){state=blank();save();render();}}
function normalizeView(){if(!profileReady())state.view='profile';else if(!completed()&&['result','review','report'].includes(state.view))state.view='journey';}
// textarea 초기값을 렌더 후 반영해 긴 글·따옴표·줄바꿈을 그대로 보존한다.
const baseRender=render;render=function(){baseRender();const f=document.getElementById('reflection');if(f)f.value=state.review.reflection;};
normalizeView();render();
</script></body></html>
